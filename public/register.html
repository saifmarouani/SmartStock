<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartStock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="split-screen-container">
        <div class="auth-left">
            <div class="auth-content">
                <div class="auth-header">
                    <div class="logo-display">
                        <i class="fa-solid fa-boxes-stacked logo-icon"></i>
                        <h2>SmartStock</h2>
                    </div>
                    <h1>Create an account</h1>
                    <p>Start tracking your inventory today.</p>
                </div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label>Company Name</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-building"></i>
                            <input type="text" id="regCompany" placeholder="My Business Ltd." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="name@company.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Create a password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary full-width">Get Started</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="hero-overlay">
                <h2>Scale Your Operations</h2>
                <p>Join thousands of businesses managing their stock smarter.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
