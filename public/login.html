<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartStock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="split-screen-container">
        <div class="auth-left">
            <div class="auth-content">
                <div class="logo-display">
                    <i class="fa-solid fa-boxes-stacked logo-icon"></i>
                    <h2>SmartStock</h2>
                </div>
                
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your credentials to access your dashboard.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="name@company.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Sign In</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Sign up</a></p>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="hero-overlay">
                <h2>Manage your inventory with precision.</h2>
                <p>Track stock across multiple warehouses in real-time.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
